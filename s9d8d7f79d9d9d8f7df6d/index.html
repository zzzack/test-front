<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>海盐蓝治愈小屋 · 3D 漫游</title>

<!-- ESM importmap：免构建直接从 CDN 拉取 three 及其 addons -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<style>
  /* ===== 设计令牌：海盐蓝 + 奶油白 + 一点朱红点睛 ===== */
  :root{
    --salt:#8FB4CA;          /* 海盐蓝，主色 */
    --salt-deep:#4E7B99;     /* 深海盐，用于文字/边框 */
    --cream:#F6F1E8;         /* 奶油白，面板底 */
    --ink:#2B3440;           /* 主文字 */
    --sub:#6B7A88;           /* 次级文字 */
    --coral:#C0392E;         /* 灯具同款朱红，仅用于当前态 */
    --panel:rgba(246,241,232,.92);
    --radius:18px;
    --shadow:0 8px 28px rgba(43,52,64,.16);
    --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#DDE7ED;font-family:var(--font);color:var(--ink);}
  canvas{display:block;}

  /* ===== 加载遮罩 ===== */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(160deg,#EAF2F6 0%,#F6F1E8 100%);transition:opacity .5s;}
  #loader h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.04em;}
  #loader p{margin:0;color:var(--sub);font-size:13px;}
  .bar{width:190px;height:3px;background:#D6E1E8;border-radius:2px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:20%;background:var(--salt);border-radius:2px;
    animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(500%)}}
  @media (prefers-reduced-motion:reduce){.bar>i{animation:none;width:100%}}

  /* ===== 通用面板 ===== */
  .panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;font-size:13px;z-index:20;}
  .panel h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--salt-deep);}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .row:last-child{margin-bottom:0;}
  button.chip{border:1px solid #D9DFE4;background:#fff;border-radius:999px;
    padding:6px 11px;font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;}
  button.chip:hover{border-color:var(--salt);}
  button.chip[aria-pressed="true"]{background:var(--salt);border-color:var(--salt);color:#fff;}
  button.chip:focus-visible{outline:2px solid var(--coral);outline-offset:2px;}

  /* ===== 顶部状态条 ===== */
  #topbar{top:12px;left:12px;display:flex;align-items:center;gap:10px;padding:9px 14px;}
  #roomName{font-weight:600;}
  #fps{color:var(--sub);font-variant-numeric:tabular-nums;}
  #modeTag{color:var(--coral);font-weight:600;}

  /* ===== 右上小地图 ===== */
  #mapWrap{top:12px;right:12px;padding:10px;}
  #minimap{display:block;border-radius:10px;background:#fff;}
  #roomBtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-width:196px;}
  #roomBtns button{padding:4px 8px;font-size:11px;}

  /* ===== 左下控制面板 ===== */
  #ctrl{left:12px;bottom:12px;max-width:250px;}
  select{width:100%;padding:6px 8px;border-radius:10px;border:1px solid #D9DFE4;
    background:#fff;font-family:inherit;font-size:12px;color:var(--ink);}
  label{display:block;font-size:11px;color:var(--sub);margin:0 0 4px;}
  #ctrlBody.hidden{display:none;}
  #ctrlToggle{position:absolute;top:10px;right:12px;border:none;background:none;
    cursor:pointer;color:var(--sub);font-size:16px;line-height:1;padding:2px;}

  /* ===== 信息卡 ===== */
  #card{right:12px;bottom:12px;width:230px;display:none;}
  #card h2{margin:0 0 2px;font-size:15px;}
  #card .price{color:var(--coral);font-weight:600;font-size:16px;margin-top:6px;}
  #card dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;}
  #card dt{color:var(--sub);}#card dd{margin:0;}
  #card .close{position:absolute;top:8px;right:12px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:16px;}

  /* ===== 准星 ===== */
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:rgba(43,52,64,.55);box-shadow:0 0 0 2px rgba(255,255,255,.6);
    pointer-events:none;z-index:15;display:none;}

  /* ===== 开始提示 ===== */
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;
    background:var(--panel);padding:16px 22px;border-radius:var(--radius);box-shadow:var(--shadow);
    text-align:center;font-size:13px;line-height:1.7;cursor:pointer;backdrop-filter:blur(10px);}
  #hint b{display:block;font-size:15px;margin-bottom:6px;}
  #hint kbd{background:#fff;border:1px solid #D9DFE4;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;}

  /* ===== 移动端触控 ===== */
  #touch{position:fixed;inset:0;z-index:14;display:none;}
  #stick{position:absolute;left:24px;bottom:28px;width:112px;height:112px;border-radius:50%;
    background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.6);}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;background:var(--salt);opacity:.85;}
  #runBtn{position:absolute;right:26px;bottom:36px;width:66px;height:66px;border-radius:50%;
    background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);color:var(--salt-deep);
    font-size:12px;font-weight:600;font-family:inherit;}
  body.mobile #touch{display:block;}
  body.mobile #ctrl{max-width:190px;font-size:12px;}
  body.mobile #roomBtns{max-width:150px;}
</style>
</head>
<body>

<div id="loader">
  <h1>海盐蓝治愈小屋</h1>
  <p>正在生成 85㎡ 的家…</p>
  <div class="bar"><i></i></div>
</div>

<div id="topbar" class="panel">
  <span id="roomName">玄关</span>
  <span id="modeTag">漫游</span>
  <span id="fps">-- fps</span>
</div>

<div id="mapWrap" class="panel">
  <canvas id="minimap" width="196" height="128"></canvas>
  <div id="roomBtns"></div>
</div>

<div id="ctrl" class="panel">
  <button id="ctrlToggle" title="收起面板">▾</button>
  <h3>软装调整</h3>
  <div id="ctrlBody">
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label for="floorSel">地面材质</label>
      <select id="floorSel"></select>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label for="wallSel">墙面色</label>
      <select id="wallSel"></select>
    </div>
    <label>光线氛围</label>
    <div class="row" id="lightRow"></div>
    <label>画质</label>
    <div class="row" id="qualityRow">
      <button class="chip" id="ppBtn" aria-pressed="true">后处理</button>
      <button class="chip" id="shadowBtn" aria-pressed="true">阴影</button>
    </div>
  </div>
</div>

<div id="card" class="panel">
  <button class="close" aria-label="关闭">✕</button>
  <h2 id="cName">--</h2>
  <div class="price" id="cPrice"></div>
  <dl>
    <dt>尺寸</dt><dd id="cSize"></dd>
    <dt>材质</dt><dd id="cMat"></dd>
  </dl>
</div>

<div id="cross"></div>

<div id="hint">
  <b>点击进入漫游</b>
  <kbd>W A S D</kbd> 移动 · <kbd>Shift</kbd> 加速 · <kbd>Tab</kbd> 切换视角<br />
  鼠标转向 · 点击家具查看详情 · <kbd>Esc</kbd> 退出
</div>

<div id="touch">
  <div id="stick"><i></i></div>
  <button id="runBtn">快走</button>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
